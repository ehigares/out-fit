name: out_fit
description: Out-Fit — Bay Area outdoor fitness events and clubs MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2 chosen for strong typing, testability,
  # and first-class async support without boilerplate.
  flutter_riverpod: ^2.5.1

  # Backend — Supabase for auth + Postgres + storage
  supabase_flutter: ^2.5.2

  # Navigation
  go_router: ^13.2.4

  # Environment variables (SUPABASE_URL, SUPABASE_ANON_KEY)
  flutter_dotenv: ^5.1.0

  # Date/time formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
